[package]
name = "lodestone"
version = "0.1.0"
edition = "2021"
description = "Manual, git-like bidirectional folder sync on top of rclone bisync"
license = "MIT"

[[bin]]
name = "lode"
path = "src/main.rs"

[lib]
name = "lodestone"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
